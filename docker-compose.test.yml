services:

  mysql_test:
    image: mysql:8
    container_name: mysql_test
    env_file:
      - .env.test
    ports:
      - "3308:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_test_data:/var/lib/mysql
    networks:
      - test_network

volumes:
  mysql_test_data:

networks:
  test_network: