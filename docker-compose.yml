version: '3.8'

services:

  mysql_dev:
    image: mysql:8
    container_name: mysql_dev
    hostname: mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dw_dev
    ports:
      - "3307:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  mysql_test:
    image: mysql:8
    container_name: mysql_test
    hostname: mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dw_test
    ports:
      - "3308:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  mysql_prod:
    image: mysql:8
    container_name: mysql_prod
    hostname: mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dw_prod
    ports:
      - "3309:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  etl:
    build: ./etl
    container_name: etl_service
    volumes:
      - ./etl:/app
      - ./data:/data
    working_dir: /app
    command: sh -c "sleep 30 && python etl.py"
    depends_on:
      - mysql_dev